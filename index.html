<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrackZapDJ — Clean your DJ library</title>
<meta name="description" content="TrackZapDJ: find and clean up duplicates in your DJ library. Choose your language. / Repérez et nettoyez les doublons de votre bibliothèque DJ. Choisissez votre langue.">
<meta name="theme-color" content="#05070b">
<link rel="canonical" href="https://www.trackzapdj.com/en/">
<link rel="alternate" hreflang="fr" href="https://www.trackzapdj.com/fr/">
<link rel="alternate" hreflang="en" href="https://www.trackzapdj.com/en/">
<link rel="alternate" hreflang="x-default" href="https://www.trackzapdj.com/en/">
<link rel="icon" href="/images/TrackZapDJ.ico">
<link rel="stylesheet" href="/assets/style.css">
<script>
  // En production, le Worker (src/worker.js) redirige déjà "/" vers /fr/ ou /en/.
  // Cette page ne sert que de repli si elle est servie directement : même ordre de priorité.
  (function () {
    var match = document.cookie.match(/(?:^|;\s*)lang=(fr|en)(?:;|$)/);
    var lang = match ? match[1] : null;
    if (!lang) {
      var prefs = navigator.languages || [navigator.language || ''];
      for (var i = 0; i < prefs.length && !lang; i++) {
        var code = String(prefs[i]).toLowerCase().split('-')[0];
        if (code === 'fr' || code === 'en') lang = code;
      }
    }
    location.replace('/' + (lang || 'en') + '/' + location.search);
  })();
</script>
</head>
<body>
<main class="chooser">
  <div>
    <img src="/images/TrackZapDJ-LogoCarre.png" alt="TrackZapDJ" width="120" height="120">
    <h1><span class="t1">Track</span><span class="t2">Zap</span><span class="t3">DJ</span></h1>
    <p class="cta">
      <a class="btn btn-primary" href="/fr/" hreflang="fr" lang="fr">Français</a>
      <a class="btn btn-ghost" href="/en/" hreflang="en" lang="en">English</a>
    </p>
  </div>
</main>
</body>
</html>
